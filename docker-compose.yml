version: '3.8'
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_URL: http://localhost:8080
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: pincode
      DB_USER: pincode
      DB_PASS: pincode
    command: sh -c "php -S 0.0.0.0:8080 index.php"
    depends_on:
      - db
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: pincode
      MYSQL_USER: pincode
      MYSQL_PASSWORD: pincode
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
