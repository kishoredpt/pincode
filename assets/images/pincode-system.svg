<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PIN Code System Illustration</title>
  <desc id="desc">Visual explaining zone, sorting and local office levels of a PIN code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="600" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="46" fill="#1e3a8a" font-weight="700">India PIN Code Routing Logic</text>
  <g font-family="Arial, sans-serif" fill="#111827" text-anchor="middle">
    <rect x="120" y="200" width="300" height="210" rx="16" fill="#ffffff" stroke="#93c5fd"/>
    <text x="270" y="255" font-size="34" font-weight="700">1st Digit</text>
    <text x="270" y="300" font-size="28">Postal Zone</text>
    <text x="270" y="345" font-size="22" fill="#374151">National-level routing</text>

    <rect x="450" y="200" width="300" height="210" rx="16" fill="#ffffff" stroke="#93c5fd"/>
    <text x="600" y="255" font-size="34" font-weight="700">2nd-3rd Digits</text>
    <text x="600" y="300" font-size="28">Sorting Region</text>
    <text x="600" y="345" font-size="22" fill="#374151">Regional mail processing</text>

    <rect x="780" y="200" width="300" height="210" rx="16" fill="#ffffff" stroke="#93c5fd"/>
    <text x="930" y="255" font-size="34" font-weight="700">Last 3 Digits</text>
    <text x="930" y="300" font-size="28">Delivery Office</text>
    <text x="930" y="345" font-size="22" fill="#374151">Final local destination</text>
  </g>
</svg>
