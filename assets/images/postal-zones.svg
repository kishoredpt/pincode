<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Postal Zones of India</title>
  <desc id="desc">Conceptual representation of how postal zones support sorting.</desc>
  <rect width="1200" height="630" fill="#f8fafc"/>
  <text x="600" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" fill="#0f172a" font-weight="700">Postal Zones Improve National Sorting</text>
  <g font-family="Arial, sans-serif" font-size="24" fill="#1f2937">
    <circle cx="250" cy="250" r="95" fill="#dbeafe"/>
    <circle cx="470" cy="250" r="95" fill="#bfdbfe"/>
    <circle cx="690" cy="250" r="95" fill="#93c5fd"/>
    <circle cx="910" cy="250" r="95" fill="#60a5fa"/>
    <text x="250" y="258" text-anchor="middle">Zone</text>
    <text x="470" y="258" text-anchor="middle">Region</text>
    <text x="690" y="258" text-anchor="middle">District</text>
    <text x="910" y="258" text-anchor="middle">Office</text>
  </g>
  <g stroke="#1d4ed8" stroke-width="6" fill="none">
    <path d="M345 250 L375 250"/>
    <path d="M565 250 L595 250"/>
    <path d="M785 250 L815 250"/>
  </g>
  <text x="600" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#334155">Structured routing reduces mis-sorts and improves delivery reliability.</text>
</svg>
